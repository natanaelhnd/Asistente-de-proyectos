<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente de Proyectos</title>
<style>
:root{--bg:#0d1218;--panel:#151d27;--panel2:#1b2531;--text:#f4f7fb;--muted:#9aa8b7;--accent:#5ee0a3;--danger:#ff5b66;--border:#2a3644}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.app{max-width:680px;margin:auto;padding:24px 16px 24px;min-height:100vh}h1{margin:6px 0}.small{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}.activity{padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}.activity:last-child{border:0}.empty{text-align:center;color:var(--muted);padding:28px}
.home-layout{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(88px,1fr);gap:9px;align-items:stretch;height:calc(100vh - 150px);min-height:420px}.agenda-card{margin:0;overflow:hidden;display:flex;flex-direction:column}.agenda-scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding-right:2px}.side-menu{display:grid;grid-template-rows:repeat(5,58px);gap:7px;align-content:start}.side-menu .btn{padding:6px 4px;text-align:center;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.05;border-radius:12px}.side-menu .btn .icon{font-size:17px}.side-menu .badge{right:-5px;top:-5px}.project-name{font-size:16px;font-weight:800;line-height:1.15;margin-bottom:5px}.activity-name{font-size:13px;color:var(--muted)}.menu{display:grid;gap:10px;margin-top:20px}button,input,textarea{font:inherit}.btn{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:16px;border-radius:16px;font-weight:700;text-align:left;position:relative}.primary{background:var(--accent);color:#082217}.danger{background:#3a2024;color:#ffb2b2}.back{background:none;border:0;color:var(--accent);padding:8px 0;font-weight:700}
.badge{position:absolute;right:-7px;top:-7px;background:var(--danger);color:white;border:2px solid var(--bg);min-width:25px;height:25px;border-radius:99px;display:grid;place-items:center;font-size:12px}
input,textarea,select{width:100%;background:#0f151d;color:white;border:1px solid var(--border);border-radius:14px;padding:14px}textarea{min-height:95px}.date-input{color-scheme:dark}.wheel-wrap{height:150px;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:#0f151d;position:relative}.wheel{height:150px;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:60px 0}.wheel-option{height:30px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-weight:700}.wheel-line{position:absolute;left:10px;right:10px;top:59px;height:32px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);pointer-events:none}.stepper{display:flex;gap:14px;align-items:center}.stepper button{width:48px;height:48px;background:var(--panel2);color:white;border:1px solid var(--border);border-radius:14px;font-size:22px}.stage,.advance{padding:13px;background:var(--panel2);border-radius:14px;margin:8px 0}.current{outline:2px solid var(--accent)}.advance{border:1px solid var(--border);cursor:pointer}
.field-action{font-size:12px;color:var(--muted);margin-top:6px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:end;padding:16px;z-index:20}.sheet{width:min(680px,100%);margin:auto;background:var(--panel);padding:20px;border-radius:24px}.choice{width:100%;margin:7px 0;padding:15px;text-align:left;background:var(--panel2);color:white;border:1px solid var(--border);border-radius:14px;font-weight:700}.status-line{margin-top:8px;color:var(--muted);font-size:13px}
@media(max-width:390px){.app{padding:18px 10px}.home-layout{grid-template-columns:minmax(0,2.2fr) minmax(80px,1fr)}.side-menu .btn{font-size:9px}.project-name{font-size:15px}}
</style>
</head><body><div id="app"></div><script>
const KEY='asistente-proyectos-v3';
let P=JSON.parse(localStorage.getItem(KEY)||'[]'),screen='home',selected=null,days=10,modal=null;
let newName='',newDescription='',newSaleDate=today();
const stages=['Visita de rectificación de medidas','Realizar minuta de materiales y hacer solicitud','Fabricación','Instalación'];
const icons=['📐','📋','🛠️','🔧'];
function today(){return new Date().toISOString().slice(0,10)}
function addNoSunday(start,n){let d=new Date(start+'T12:00:00');while(n){d.setDate(d.getDate()+1);if(d.getDay()!=0)n--}return d.toISOString().slice(0,10)}
function fmt(x){return new Date(x+'T12:00:00').toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function ord(n){return ['Primer','Segundo','Tercer','Cuarto','Quinto','Sexto','Séptimo','Octavo','Noveno','Décimo'][n-1]||n+'°'}
function save(){localStorage.setItem(KEY,JSON.stringify(P))}
function active(p){return (p.activities||[]).find(a=>!a.done&&a.stage===p.stage)}
function saleDate(p){return p.saleDate||p.createdDate||today()}
function statusText(p){
 if(p.stage===0&&p.flowState==='rectification_done_waiting_material')return 'Rectificación realizada · esperando pedir material';
 if(p.stage===1&&p.flowState==='waiting_material')return 'Material solicitado · esperando disponibilidad';
 if(p.stage===1&&p.flowState==='material_available')return 'Material disponible · esperando fabricación';
 return stages[p.stage]||'Proyecto';
}
function sortNewest(list){return [...list].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function needsReminder(p){
 if(p.flowState==='rectification_done_waiting_material'&&p.rectificationCompletedDate&&addNoSunday(p.rectificationCompletedDate,2)<=today())return {priority:3,icon:'⏰',name:'Hace 2 días realizaste la visita. ¿Quieres pedir el material?',date:p.rectificationCompletedDate};
 if(p.flowState==='material_available'&&p.materialAvailableDate&&addNoSunday(p.materialAvailableDate,2)<=today())return {priority:4,icon:'🏭',name:'Hace 2 días tiene material disponible y está esperando fabricación.',date:p.materialAvailableDate};
 return null;
}
function homeAgenda(){
 const items=[];
 P.forEach(p=>{
  if(p.status!=='Activo')return;
  if(p.deadline<today())items.push({p,priority:0,icon:'⚠️',name:'Proyecto vencido · Entrega pactada: '+fmt(p.deadline),date:p.deadline});
  else if(p.deadline===today())items.push({p,priority:1,icon:'📅',name:'Hoy es la fecha de entrega pactada',date:p.deadline});
  (p.activities||[]).filter(a=>!a.done&&!a.reprogrammed&&a.date<=today()).forEach(a=>items.push({p,a,priority:a.date===today()?2:3,icon:a.icon,name:a.name,date:a.date}));
  const r=needsReminder(p);if(r)items.push({p,...r});
 });
 const seen=new Set();
 return items.filter(x=>{const k=x.p.id+'|'+x.priority+'|'+x.name; if(seen.has(k))return false;seen.add(k);return true}).sort((x,y)=>x.priority-y.priority||x.date.localeCompare(y.date)||(y.p.createdAt||0)-(x.p.createdAt||0));
}
function render(){
 let app=document.getElementById('app');
 app.innerHTML=screen==='home'?home():screen==='new'?newProject():screen==='rep'?reprogrammed():screen==='fabrication'?projectList('Proyectos en fabricación',P.filter(p=>p.status==='Activo'&&p.stage>=2)):screen==='active'?projectList('Proyectos activos',P.filter(p=>p.status==='Activo')):screen==='overdue'?projectList('Proyectos vencidos',P.filter(p=>p.status==='Activo'&&p.deadline<today())):screen==='search'?searchScreen():screen==='detail'?detail():advanceDetail();
 if(modal)app.innerHTML+=modalView();
 if(screen==='new')setTimeout(()=>{initDayWheel();bindLongPressFields()},0);
}
function home(){
 const agenda=homeAgenda();
 const count=P.flatMap(p=>p.activities||[]).filter(a=>!a.done&&a.reprogrammed).length;
 return `<main class=app><h1>Hola, Natanael</h1><p class=small>Esto es lo que tienes en agenda hoy</p><div class=home-layout><section class="card agenda-card"><div class=agenda-scroll>${agenda.length?agenda.map(x=>`<div class=activity onclick="openProject('${x.p.id}')"><div class=project-name>${x.p.project}</div><div class=activity-name>${x.icon} ${x.name}${x.date!==today()&&x.priority!==0&&x.priority!==1?` · ${fmt(x.date)}`:''}</div></div>`).join(''):'<div class=empty>No tienes actividades ni entregas para hoy.</div>'}</div></section><aside class=side-menu><button class="btn primary" onclick="go('new')"><span class=icon>＋</span><span>Agregar</span></button><button class=btn onclick="go('fabrication')"><span class=icon>🏭</span><span>Fabricación</span></button><button class=btn onclick="go('rep')"><span class=icon>🔄</span><span>Reprog.</span>${count?`<span class=badge>${count}</span>`:''}</button><button class="btn danger" onclick="go('overdue')"><span class=icon>⚠</span><span>Vencidos</span></button><button class=btn onclick="go('search')"><span class=icon>⌕</span><span>Buscar</span></button></aside></div></main>`;
}
function openWhatsAppFromField(){const ok=confirm('¿Quieres abrir WhatsApp?');if(ok)window.location.href='whatsapp://'}
function bindLongPressFields(){
 ['pn','pd'].forEach(id=>{const el=document.getElementById(id);if(!el||el.dataset.longpress)return;el.dataset.longpress='1';let timer=null;const clear=()=>{if(timer){clearTimeout(timer);timer=null}};el.addEventListener('touchstart',()=>{timer=setTimeout(openWhatsAppFromField,650)},{passive:true});el.addEventListener('touchend',clear,{passive:true});el.addEventListener('touchmove',clear,{passive:true});el.addEventListener('touchcancel',clear,{passive:true});el.addEventListener('contextmenu',e=>{e.preventDefault();openWhatsAppFromField()});});
}
function newProject(){
 const d=addNoSunday(newSaleDate,days),nameEsc=newName.replace(/"/g,'&quot;');
 return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Nuevo proyecto</h2><p>Proyecto</p><input id=pn value="${nameEsc}" oninput="newName=this.value" placeholder="Nombre del proyecto"><div class=field-action>Mantén presionado para abrir WhatsApp.</div><p>Descripción</p><textarea id=pd oninput="newDescription=this.value" placeholder="Descripción del proyecto">${newDescription}</textarea><div class=field-action>Mantén presionado para abrir WhatsApp.</div><p>Fecha de venta</p><input class=date-input type=date id=saleDate value="${newSaleDate}" onchange="updateSaleDate(this.value)"><p>Días pactados</p><div class=wheel-wrap><div class=wheel id=dayWheel onscroll="updateDaysFromWheel(this)">${Array.from({length:26},(_,i)=>`<div class=wheel-option data-day=${i}>${i} días</div>`).join('')}</div><div class=wheel-line></div></div><p>Fecha de entrega</p><div class=card id=deliveryDate>${fmt(d)}<div class=small>Los domingos no cuentan.</div></div><button class="btn primary" style="text-align:center" onclick="createProject()">Crear proyecto</button></main>`;
}
function updateSaleDate(v){if(!v)return;newSaleDate=v;updateDeliveryDate()}
function updateDaysFromWheel(el){days=Math.max(0,Math.min(25,Math.round(el.scrollTop/30)));updateDeliveryDate()}
function updateDeliveryDate(){const dateEl=document.getElementById('deliveryDate');if(dateEl)dateEl.innerHTML=fmt(addNoSunday(newSaleDate,days))+'<div class="small">Los domingos no cuentan.</div>'}
function initDayWheel(){const w=document.getElementById('dayWheel');if(w)w.scrollTop=days*30}
function createProject(){
 const name=document.getElementById('pn').value.trim(),description=document.getElementById('pd').value.trim();
 if(!name)return alert('Escribe el nombre del proyecto.');
 const now=Date.now(),p={id:String(now),project:name,description,saleDate:newSaleDate,createdDate:today(),createdAt:now,status:'Activo',stage:0,flowState:'rectification_pending',deadline:addNoSunday(newSaleDate,days),advances:[],activities:[{id:'a'+now,stage:0,name:stages[0],icon:icons[0],date:addNoSunday(newSaleDate,1),done:false,reprogrammed:false}],history:[{date:today(),text:'Proyecto creado'}]};
 P.unshift(p);save();days=10;newName='';newDescription='';newSaleDate=today();screen='home';render();
}
function projectList(title,list){const ordered=sortNewest(list);return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>${title}</h2>${ordered.length?ordered.map(p=>`<div class=card onclick="openProject('${p.id}')"><b>${p.project}</b><div class=small>${statusText(p)} · Entrega: ${fmt(p.deadline)}</div></div>`).join(''):'<div class=card><div class=empty>No hay proyectos.</div></div>'}</main>`}
function reprogrammed(){const list=P.flatMap(p=>(p.activities||[]).filter(a=>!a.done&&a.reprogrammed).map(a=>({p,a}))).sort((x,y)=>x.a.date.localeCompare(y.a.date));return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Actividades reprogramadas</h2>${list.length?list.map(x=>`<div class=card onclick="openProject('${x.p.id}')"><b>${x.a.icon} ${x.a.name}</b><div class=small>${x.p.project}</div><div class=small>Programada: ${fmt(x.a.date)} · Después del ${ord(x.a.afterAdvance)} avance</div></div>`).join(''):'<div class=card><div class=empty>No hay actividades reprogramadas pendientes.</div></div>'}</main>`}
function detail(){
 const p=P.find(x=>x.id===selected);if(!p)return home();const a=active(p);
 return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>${p.project}</h2><div class=card>${p.description||'Sin descripción'}<div class=small style="margin-top:12px">Venta: ${fmt(saleDate(p))}</div><div class=small style="margin-top:6px">Entrega: ${fmt(p.deadline)}</div><div class=status-line>${statusText(p)}</div></div><div class=card><b>Flujo del proyecto</b>${stages.map((s,i)=>`<div class="stage ${p.stage===i?'current':''}">${icons[i]} ${p.stage===i&&i===3&&p.advances.length?ord(p.advances.length+1)+' avance':s}</div>`).join('')}</div>${p.stage===3?`<div class=card><b>Avances del proyecto</b>${p.advances.length?p.advances.map(v=>`<div class=advance onclick="showAdvance('${v.id}')"><b>🔧 ${v.name}</b><div class=small>${fmt(v.date)} · Ver detalles ›</div></div>`).join(''):'<div class=small style="padding-top:12px">Aún no hay avances registrados.</div>'}</div>`:''}<div class=card><b>Actividad actual</b><div class="stage current">${a?a.icon+' '+a.name:statusText(p)}</div>${a?`<div class=small>${fmt(a.date)}</div>`:'<div class=small style="margin-top:8px">Este proyecto está esperando tu decisión.</div>'}${a?`<button class="btn primary" style="text-align:center;margin-top:12px" onclick="completeCurrent()">Completar actividad</button>`:`<button class="btn primary" style="text-align:center;margin-top:12px" onclick="resumeFlow()">Continuar proyecto</button>`}</div></main>`;
}
function completeCurrent(){
 const p=P.find(x=>x.id===selected),a=active(p);if(!a)return;
 if(p.stage===0){a.done=true;p.rectificationCompletedDate=today();p.flowState='rectification_done_waiting_material';p.history.push({date:today(),text:'Completado: '+a.name});modal={type:'rectificationChoice',projectId:p.id};save();render();return;}
 if(p.stage===1){a.done=true;p.materialRequestedDate=today();p.flowState='waiting_material';p.history.push({date:today(),text:'Minuta y solicitud de materiales realizada'});modal={type:'materialAvailability',projectId:p.id};save();render();return;}
 if(p.stage===2){a.done=true;p.history.push({date:today(),text:'Fabricación completada'});p.stage=3;p.flowState='installation';p.activities.push({id:'a'+Date.now(),stage:3,name:'Instalación',icon:'🔧',date:today(),done:false,reprogrammed:false});save();render();return;}
 a.done=true;modal={type:'registerAdvance',projectId:p.id};render();
}
function resumeFlow(){const p=P.find(x=>x.id===selected);if(!p)return;if(p.flowState==='rectification_done_waiting_material'){modal={type:'rectificationChoice',projectId:p.id};render();return;}if(p.flowState==='material_available'){modal={type:'materialAvailableChoice',projectId:p.id};render();return;}if(p.flowState==='waiting_material'){modal={type:'materialAvailability',projectId:p.id,waiting:true};render();return;}}
function modalView(){
 if(modal.type==='rectificationChoice')return `<div class=modal><div class=sheet><h2>Visita realizada</h2><p>Ya realizaste la visita de rectificación de este proyecto. ¿Quieres pedir el material?</p><button class="choice" onclick="startMaterialRequest()">Sí, pedir material</button><button class="btn primary" style="text-align:center;margin-top:12px" onclick="leaveRectificationWaiting()">No, después</button></div></div>`;
 if(modal.type==='materialAvailability')return `<div class=modal><div class=sheet><h2>Solicitud de materiales</h2><p>¿Ya está disponible el material para este proyecto?</p><button class=choice onclick="markMaterialAvailable()">Sí, material disponible</button><button class="btn primary" style="text-align:center;margin-top:12px" onclick="leaveWaitingMaterial()">No, todavía no</button></div></div>`;
 if(modal.type==='materialAvailableChoice')return `<div class=modal><div class=sheet><h2>Material disponible</h2><p>¿Quieres mandar a fabricación este proyecto?</p><button class=choice onclick="sendToFabrication()">Sí, mandar a fabricación</button><button class="btn primary" style="text-align:center;margin-top:12px" onclick="leaveMaterialAvailable()">No, dejar como Material disponible</button></div></div>`;
 if(modal.type==='registerAdvance')return `<div class=modal><div class=sheet><h2>Registrar avance</h2><p class=small>Describe brevemente el trabajo realizado.</p><textarea id=advanceDescription placeholder="Descripción del avance"></textarea><button class="btn primary" style="text-align:center;margin-top:12px" onclick="saveAdvance()">Guardar avance</button></div></div>`;
 return `<div class=modal><div class=sheet><h2>Avance registrado</h2><p>¿Deseas volver a una fase anterior?</p><button class=choice onclick="returnToStage(0)">📐 Visita de rectificación de medidas</button><button class=choice onclick="returnToStage(1)">📋 Minuta y solicitud de materiales</button><button class=choice onclick="returnToStage(2)">🛠️ Fabricación</button><button class="btn primary" style="text-align:center;margin-top:12px" onclick="stayInInstallation()">No volver a una fase anterior</button></div></div>`;
}
function startMaterialRequest(){const p=P.find(x=>x.id===modal.projectId);p.stage=1;p.flowState='material_request_pending';p.activities.push({id:'a'+Date.now(),stage:1,name:stages[1],icon:icons[1],date:today(),done:false,reprogrammed:false});p.history.push({date:today(),text:'Decidió pedir el material'});modal=null;save();render()}
function leaveRectificationWaiting(){modal=null;save();render()}
function markMaterialAvailable(){const p=P.find(x=>x.id===modal.projectId);p.flowState='material_available';p.materialAvailableDate=today();p.history.push({date:today(),text:'Material marcado como disponible'});modal={type:'materialAvailableChoice',projectId:p.id};save();render()}
function leaveWaitingMaterial(){const p=P.find(x=>x.id===modal.projectId);p.flowState='waiting_material';modal=null;save();render()}
function sendToFabrication(){const p=P.find(x=>x.id===modal.projectId);p.stage=2;p.flowState='fabrication';p.fabricationStartDate=today();p.activities.push({id:'a'+Date.now(),stage:2,name:'Fabricación',icon:'🛠️',date:today(),done:false,reprogrammed:false});p.history.push({date:today(),text:'Proyecto enviado a fabricación'});modal=null;save();render()}
function leaveMaterialAvailable(){modal=null;save();render()}
function saveAdvance(){const p=P.find(x=>x.id===modal.projectId),desc=document.getElementById('advanceDescription').value.trim(),n=p.advances.length+1,v={id:'v'+Date.now(),name:ord(n)+' avance',date:today(),description:desc,returnedTo:null,reprogrammedDate:null};p.advances.push(v);p.history.push({date:today(),text:v.name+' registrado'});modal={type:'chooseStage',projectId:p.id,advanceId:v.id};save();render()}
function returnToStage(stage){const p=P.find(x=>x.id===modal.projectId),v=p.advances.find(x=>x.id===modal.advanceId),next=addNoSunday(today(),1);v.returnedTo=stage;v.reprogrammedDate=next;p.stage=stage;p.flowState=stage===0?'rectification_pending':stage===1?'material_request_pending':'fabrication';p.activities.push({id:'r'+Date.now(),stage,name:stages[stage],icon:icons[stage],date:next,done:false,reprogrammed:true,afterAdvance:p.advances.length});p.history.push({date:today(),text:`Después del ${v.name}, regresó a ${stages[stage]}. Reprogramada para ${next}.`});modal=null;save();render()}
function stayInInstallation(){const p=P.find(x=>x.id===modal.projectId);p.activities.push({id:'a'+Date.now(),stage:3,name:'Instalación',icon:'🔧',date:today(),done:false,reprogrammed:false});modal=null;save();render()}
function showAdvance(aid){const p=P.find(x=>x.id===selected),v=p.advances.find(x=>x.id===aid);alert(`${v.name}\n\nFecha: ${fmt(v.date)}\n\nTrabajo realizado:\n${v.description||'Sin descripción'}${v.returnedTo!==null?`\n\nRegresó a: ${stages[v.returnedTo]}\nReprogramada para: ${fmt(v.reprogrammedDate)}`:''}`)}
function searchScreen(){return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Buscar proyecto</h2><input oninput="searchProjects(this.value)" placeholder="Buscar por proyecto o descripción"><div id=results></div></main>`}
function searchProjects(q){const list=sortNewest(P.filter(p=>((p.project||'')+' '+(p.description||'')).toLowerCase().includes(q.toLowerCase())));document.getElementById('results').innerHTML=list.map(p=>`<div class=card onclick="openProject('${p.id}')"><b>${p.project}</b></div>`).join('')}
function openProject(x){selected=x;screen='detail';render()}function go(x){screen=x;modal=null;render()}
function advanceDetail(){return home()}
render();
</script></body></html>
