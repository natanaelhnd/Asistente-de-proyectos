<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente de Proyectos</title>
<style>
:root{--bg:#0d1218;--panel:#151d27;--panel2:#1b2531;--text:#f4f7fb;--muted:#9aa8b7;--accent:#5ee0a3;--danger:#ff5b66;--border:#2a3644}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.app{max-width:680px;margin:auto;padding:24px 16px 44px;min-height:100vh}h1{margin:6px 0}.small{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}.activity{padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}.activity:last-child{border:0}.empty{text-align:center;color:var(--muted);padding:28px}
.menu{display:grid;gap:10px;margin-top:20px}button,input,textarea{font:inherit}.btn{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:16px;border-radius:16px;font-weight:700;text-align:left;position:relative}.primary{background:var(--accent);color:#082217}.danger{background:#3a2024;color:#ffb2b2}.back{background:none;border:0;color:var(--accent);padding:8px 0;font-weight:700}
.badge{position:absolute;right:-7px;top:-7px;background:var(--danger);color:white;border:2px solid var(--bg);min-width:25px;height:25px;border-radius:99px;display:grid;place-items:center;font-size:12px}
input,textarea{width:100%;background:#0f151d;color:white;border:1px solid var(--border);border-radius:14px;padding:14px}textarea{min-height:95px}.stepper{display:flex;gap:14px;align-items:center}.stepper button{width:48px;height:48px;background:var(--panel2);color:white;border:1px solid var(--border);border-radius:14px;font-size:22px}.stage,.advance{padding:13px;background:var(--panel2);border-radius:14px;margin:8px 0}.current{outline:2px solid var(--accent)}.advance{border:1px solid var(--border);cursor:pointer}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:end;padding:16px;z-index:20}.sheet{width:min(680px,100%);margin:auto;background:var(--panel);padding:20px;border-radius:24px}.choice{width:100%;margin:7px 0;padding:15px;text-align:left;background:var(--panel2);color:white;border:1px solid var(--border);border-radius:14px;font-weight:700}
</style>
</head><body><div id="app"></div><script>
const KEY='asistente-proyectos-v3';
let P=JSON.parse(localStorage.getItem(KEY)||'[]'),screen='home',selected=null,days=10,modal=null;
let newName='', newDescription='';
const stages=['Visita de rectificación de medidas','Realizar minuta de materiales y hacer solicitud','Fabricación','Instalación'];
const icons=['📐','📋','🛠️','🔧'];
const today=()=>new Date().toISOString().slice(0,10);
function addNoSunday(start,n){let d=new Date(start+'T12:00:00');while(n){d.setDate(d.getDate()+1);if(d.getDay()!=0)n--}return d.toISOString().slice(0,10)}
function fmt(x){return new Date(x+'T12:00:00').toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function ord(n){return ['Primer','Segundo','Tercer','Cuarto','Quinto','Sexto','Séptimo','Octavo','Noveno','Décimo'][n-1]||n+'°'}
function save(){localStorage.setItem(KEY,JSON.stringify(P))}
function active(p){return p.activities.find(a=>!a.done&&a.stage===p.stage)}
function render(){
 let app=document.getElementById('app');
 app.innerHTML=screen==='home'?home():screen==='new'?newProject():screen==='rep'?reprogrammed():screen==='active'?projectList('Proyectos activos',P.filter(p=>p.status==='Activo')):screen==='overdue'?projectList('Proyectos vencidos',P.filter(p=>p.status==='Activo'&&p.deadline<today())):screen==='search'?searchScreen():screen==='detail'?detail():advanceDetail();
 if(modal)app.innerHTML+=modalView();
}
function home(){
 const agenda=P.flatMap(p=>p.activities.filter(a=>!a.done&&!a.reprogrammed&&a.date===today()).map(a=>({p,a})));
 const count=P.flatMap(p=>p.activities).filter(a=>!a.done&&a.reprogrammed).length;
 return `<main class=app><h1>Hola, Natanael</h1><p class=small>Esto es lo que tienes en agenda hoy</p>
 <section class=card>${agenda.length?agenda.map(x=>`<div class=activity onclick="openProject('${x.p.id}')"><b>${x.a.icon} ${x.a.name}</b><div class=small>${x.p.project}</div></div>`).join(''):'<div class=empty>No tienes actividades programadas para hoy.</div>'}</section>
 <div class=menu>
 <button class="btn primary" onclick="go('new')">＋ Agregar proyecto</button>
 <button class=btn onclick="go('rep')">🔄 Actividades reprogramadas${count?`<span class=badge>${count}</span>`:''}</button>
 <button class=btn onclick="go('active')">▣ Proyectos activos</button>
 <button class="btn danger" onclick="go('overdue')">⚠ Proyectos vencidos</button>
 <button class=btn onclick="go('search')">⌕ Buscar proyecto</button>
 </div></main>`;
}
function newProject(){
 const t=today(),d=addNoSunday(t,days);
 return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Nuevo proyecto</h2>
 <p>Proyecto</p><input id=pn value="${newName.replace(/"/g,'&quot;')}" oninput="newName=this.value" placeholder="Nombre del proyecto">
 <p>Descripción del proyecto</p><textarea id=pd oninput="newDescription=this.value">${newDescription}</textarea>
 <p>Fecha de venta</p><div class=card>${fmt(t)}</div>
 <p>Días pactados</p><div class=stepper><button onclick="days=Math.max(1,days-1);render()">−</button><b>${days} días</b><button onclick="days++;render()">＋</button></div>
 <p>Fecha de entrega</p><div class=card>${fmt(d)}<div class=small>Los domingos no cuentan.</div></div>
 <button class="btn primary" style="text-align:center" onclick="createProject()">Crear proyecto</button></main>`;
}
function createProject(){
 const name=document.getElementById('pn').value.trim(),description=document.getElementById('pd').value.trim();
 if(!name)return alert('Escribe el nombre del proyecto.');
 const t=today(),p={id:String(Date.now()),project:name,description,status:'Activo',stage:0,deadline:addNoSunday(t,days),advances:[],activities:[{id:'a'+Date.now(),stage:0,name:stages[0],icon:icons[0],date:t,done:false,reprogrammed:false}],history:[{date:t,text:'Proyecto creado'}]};
 P.push(p);save();days=10;newName='';newDescription='';screen='home';render();
}
function projectList(title,list){return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>${title}</h2>${list.length?list.map(p=>`<div class=card onclick="openProject('${p.id}')"><b>${p.project}</b><div class=small>${stages[p.stage]} · Entrega: ${fmt(p.deadline)}</div></div>`).join(''):'<div class=card><div class=empty>No hay proyectos.</div></div>'}</main>`}
function reprogrammed(){
 const list=P.flatMap(p=>p.activities.filter(a=>!a.done&&a.reprogrammed).map(a=>({p,a}))).sort((x,y)=>x.a.date.localeCompare(y.a.date));
 return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Actividades reprogramadas</h2>${list.length?list.map(x=>`<div class=card onclick="openProject('${x.p.id}')"><b>${x.a.icon} ${x.a.name}</b><div class=small>${x.p.project}</div><div class=small>Programada: ${fmt(x.a.date)} · Después del ${ord(x.a.afterAdvance)} avance</div></div>`).join(''):'<div class=card><div class=empty>No hay actividades reprogramadas pendientes.</div></div>'}</main>`;
}
function detail(){
 const p=P.find(x=>x.id===selected);if(!p)return home();const a=active(p);
 return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>${p.project}</h2>
 <div class=card>${p.description||'Sin descripción'}<div class=small style="margin-top:12px">Entrega: ${fmt(p.deadline)}</div></div>
 <div class=card><b>Flujo del proyecto</b>${stages.map((s,i)=>`<div class="stage ${p.stage===i?'current':''}">${icons[i]} ${p.stage===i&&i===3&&p.advances.length?ord(p.advances.length+1)+' avance':s}</div>`).join('')}</div>
 ${p.stage===3?`<div class=card><b>Avances del proyecto</b>${p.advances.length?p.advances.map(v=>`<div class=advance onclick="showAdvance('${v.id}')"><b>🔧 ${v.name}</b><div class=small>${fmt(v.date)} · Ver detalles ›</div></div>`).join(''):'<div class=small style="padding-top:12px">Aún no hay avances registrados.</div>'}</div>`:''}
 <div class=card><b>Actividad actual</b><div class="stage current">${a?a.icon+' '+a.name:stages[p.stage]}</div>${a?`<div class=small>${fmt(a.date)}</div>`:''}<button class="btn primary" style="text-align:center;margin-top:12px" onclick="completeCurrent()">Completar actividad</button></div></main>`;
}
function completeCurrent(){
 const p=P.find(x=>x.id===selected),a=active(p);
 if(p.stage<3){
   a.done=true;p.history.push({date:today(),text:'Completado: '+a.name});p.stage++;
   p.activities.push({id:'a'+Date.now(),stage:p.stage,name:stages[p.stage],icon:icons[p.stage],date:today(),done:false,reprogrammed:false});
   save();render();return;
 }
 // La actividad de instalación queda cerrada al registrar el avance: así no vuelve a la agenda.
 a.done=true;
 modal={type:'registerAdvance',projectId:p.id};render();
}
function modalView(){
 if(modal.type==='registerAdvance')return `<div class=modal><div class=sheet><h2>Registrar avance</h2><p class=small>Describe brevemente el trabajo realizado.</p><textarea id=advanceDescription placeholder="Descripción del avance"></textarea><button class="btn primary" style="text-align:center;margin-top:12px" onclick="saveAdvance()">Guardar avance</button></div></div>`;
 return `<div class=modal><div class=sheet><h2>Avance registrado</h2><p>¿Deseas volver a una fase anterior?</p>
 <button class=choice onclick="returnToStage(0)">📐 Visita de rectificación de medidas</button>
 <button class=choice onclick="returnToStage(1)">📋 Minuta y solicitud de materiales</button>
 <button class=choice onclick="returnToStage(2)">🛠️ Fabricación</button>
 <button class="btn primary" style="text-align:center;margin-top:12px" onclick="stayInInstallation()">No volver a una fase anterior</button>
 </div></div>`;
}
function saveAdvance(){
 const p=P.find(x=>x.id===modal.projectId),desc=document.getElementById('advanceDescription').value.trim();
 const n=p.advances.length+1,v={id:'v'+Date.now(),name:ord(n)+' avance',date:today(),description:desc,returnedTo:null,reprogrammedDate:null};
 p.advances.push(v);p.history.push({date:today(),text:v.name+' registrado'});modal={type:'chooseStage',projectId:p.id,advanceId:v.id};save();render();
}
function returnToStage(stage){
 const p=P.find(x=>x.id===modal.projectId),v=p.advances.find(x=>x.id===modal.advanceId),next=addNoSunday(today(),1);
 v.returnedTo=stage;v.reprogrammedDate=next;p.stage=stage;
 p.activities.push({id:'r'+Date.now(),stage,name:stages[stage],icon:icons[stage],date:next,done:false,reprogrammed:true,afterAdvance:p.advances.length});
 p.history.push({date:today(),text:`Después del ${v.name}, regresó a ${stages[stage]}. Reprogramada para ${next}.`});
 modal=null;save();render();
}
function stayInInstallation(){
 const p=P.find(x=>x.id===modal.projectId);
 p.activities.push({id:'a'+Date.now(),stage:3,name:'Instalación',icon:'🔧',date:today(),done:false,reprogrammed:false});
 modal=null;save();render();
}
function showAdvance(aid){
 const p=P.find(x=>x.id===selected),v=p.advances.find(x=>x.id===aid);
 alert(`${v.name}\n\nFecha: ${fmt(v.date)}\n\nTrabajo realizado:\n${v.description||'Sin descripción'}${v.returnedTo!==null?`\n\nRegresó a: ${stages[v.returnedTo]}\nReprogramada para: ${fmt(v.reprogrammedDate)}`:''}`);
}
function searchScreen(){return `<main class=app><button class=back onclick="go('home')">‹ Volver</button><h2>Buscar proyecto</h2><input oninput="searchProjects(this.value)" placeholder="Buscar por proyecto o descripción"><div id=results></div></main>`}
function searchProjects(q){const list=P.filter(p=>(p.project+' '+p.description).toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=list.map(p=>`<div class=card onclick="openProject('${p.id}')"><b>${p.project}</b></div>`).join('')}
function openProject(x){selected=x;screen='detail';render()}function go(x){screen=x;modal=null;render()}
render();
</script></body></html>
